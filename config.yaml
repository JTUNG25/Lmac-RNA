# Configuration file for RNA-seq alignment workflow

# Reference genome files
genome_fasta: "reference/leptosphaeria_maculans_genome.fa"  # Path to reference genome FASTA
gtf_file: "reference/leptosphaeria_maculans_annotation.gtf"  # Optional: GTF annotation file (comment out if not available)

# Parameters
threads: 8  # Maximum number of threads to use
